<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaullet — Document & Card Vault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23C9A461'/><circle cx='50' cy='50' r='35' fill='%23171F26'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH SCREEN (Login/Register) -->
<div id="authScreen" style="position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, var(--charcoal), var(--ink) 70%); display:flex; align-items:center; justify-content:center; z-index:2000; padding:20px;">
  <div style="width:100%; max-width:420px;">
    <div style="text-align:center; margin-bottom:40px;">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100px; height:100px; margin:0 auto;">
        <circle cx="100" cy="100" r="95" fill="none" stroke="var(--brass)" stroke-width="2" opacity="0.3"/>
        <circle cx="100" cy="100" r="90" fill="none" stroke="var(--brass)" stroke-width="1.5" opacity="0.2"/>
        <circle cx="100" cy="100" r="70" fill="var(--charcoal)" stroke="var(--brass)" stroke-width="2"/>
        <g transform="translate(100, 100)">
          <path d="M -30 -15 L -10 -15 L -5 -25 L 30 -25 L 30 25 L -30 25 Z" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M -5 10 L -5 -5 M -10 0 L -5 -5 L 0 0" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
    <div style="text-align:center; margin-bottom:40px;">
      <div class="display" style="font-size:28px; font-weight:600; margin-bottom:8px;">Vaullet</div>
      <div style="color:var(--steel); font-size:13px;">Secure Document & Card Vault</div>
    </div>
    
    <!-- LOGIN FORM -->
    <div id="loginForm" style="background:var(--charcoal); border:1px solid var(--hairline); border-radius:16px; padding:32px 24px;">
      <div class="field">
        <label>Email</label>
        <div style="display:flex; gap:0;">
          <input id="loginEmail" type="text" placeholder="username" style="flex:1; border-radius:9px 0 0 9px;">
          <div style="padding:10px 12px; background:var(--graphite); border:1px solid var(--hairline); border-left:none; border-radius:0 9px 9px 0; color:var(--steel); font-size:13px; white-space:nowrap;">@vaullet.in</div>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password">
      </div>
      <div id="loginError" style="color:var(--alert); font-size:12px; margin-bottom:16px; min-height:16px; text-align:center;"></div>
      <button class="btn btn-brass" id="loginBtn" style="width:100%; margin-bottom:16px;">Login</button>
      <div style="text-align:center; color:var(--steel); font-size:12px;">
        Don't have an account? <button id="switchToRegister" class="btn-ghost" style="padding:0; border:none; color:var(--brass); font-weight:600; cursor:pointer;">Register</button>
      </div>
    </div>
    
    <!-- REGISTER FORM (hidden) -->
    <div id="registerForm" style="display:none; background:var(--charcoal); border:1px solid var(--hairline); border-radius:16px; padding:32px 24px;">
      <div class="field">
        <label>Email</label>
        <div style="display:flex; gap:0;">
          <input id="registerEmail" type="text" placeholder="username" style="flex:1; border-radius:9px 0 0 9px;">
          <div style="padding:10px 12px; background:var(--graphite); border:1px solid var(--hairline); border-left:none; border-radius:0 9px 9px 0; color:var(--steel); font-size:13px; white-space:nowrap;">@vaullet.in</div>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="registerPassword" type="password" placeholder="Create password (min 8 chars)">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input id="registerConfirm" type="password" placeholder="Confirm password">
      </div>
      <div id="registerError" style="color:var(--alert); font-size:12px; margin-bottom:16px; min-height:16px; text-align:center;"></div>
      <button class="btn btn-brass" id="registerBtn" style="width:100%; margin-bottom:16px;">Create Account</button>
      <div style="text-align:center; color:var(--steel); font-size:12px;">
        Already have an account? <button id="switchToLogin" class="btn-ghost" style="padding:0; border:none; color:var(--brass); font-weight:600; cursor:pointer;">Login</button>
      </div>
    </div>
  </div>
</div>

<!-- PIN ENTRY SCREEN -->
<div id="lock" style="display:none;"></div>

<!-- MAIN APP -->
<div id="app">
  <aside class="rail" id="rail"></aside>
  <main>
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div>
        <div class="page-title display" id="pageTitle">Home</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="lockNow" title="Lock vault">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Mobile Sidebar -->
<div class="mobile-sidebar-overlay" id="sidebarOverlay"></div>
<nav class="mobile-sidebar" id="mobileSidebar">
  <button class="sidebar-close" id="sidebarClose">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <div id="mobileSidebarNav"></div>
</nav>

<!-- Mobile Bottom Nav -->
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- MODALS -->
<div class="overlay" id="docModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title display" id="docModalTitle">New document</div>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Name</label>
        <input id="f_name" placeholder="e.g. Passport">
      </div>
      <div class="field" id="cardFields" style="display:none;">
        <label>Card number</label>
        <input id="f_number" type="text" placeholder="1234 5678 9012 3456" inputmode="numeric">
      </div>
      <div class="field" id="cardCVVField" style="display:none;">
        <label>CVV</label>
        <input id="f_cvv" type="text" placeholder="123" inputmode="numeric" maxlength="4">
      </div>
      <div class="field-row">
        <div class="field" id="dateFieldLeft">
          <label>Date</label>
          <input id="f_date" type="date">
        </div>
        <div class="field" id="expiryFieldRight" style="display:none;">
          <label>Expiry (MM/YY)</label>
          <input id="f_expiry" placeholder="12/25" maxlength="5">
        </div>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="f_category"></select>
      </div>
      <div class="field">
        <label>Tags (comma separated)</label>
        <input id="f_tags" placeholder="e.g. urgent, family">
      </div>
      <div class="field">
        <label>Attach file</label>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <button type="button" class="btn" id="cameraBtn" style="flex:1;">📷 Take photo</button>
          <button type="button" class="btn" id="filesBtn" style="flex:1;">📁 Choose file</button>
        </div>
        <input id="f_file" type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
        <input id="f_camera" type="file" accept="image/*" capture="environment" style="display:none;">
        <div id="fileSelected" style="padding:8px 12px; background:var(--graphite); border-radius:8px; color:var(--bone-dim); font-size:12px; display:none; margin-bottom:12px;"></div>
        <div class="help-text">Files encrypted before sync. Max 100MB.</div>
        <div id="existingAttachment" style="display:none; margin-top:10px;"></div>
      </div>
      <div class="field">
        <label>Expiry reminder</label>
        <select id="f_reminder">
          <option value="">No reminder</option>
          <option value="7">7 days before</option>
          <option value="30">30 days before</option>
          <option value="90">90 days before</option>
        </select>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f_notes" placeholder="Optional notes" style="min-height:80px;"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" data-close>Cancel</button>
      <button class="btn btn-brass" id="docSaveBtn">💾 Save</button>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="overlay" id="previewModal">
  <div class="modal" style="position:fixed; top:0; left:0; right:0; bottom:0; width:100vw; height:100vh; max-width:none; max-height:none; margin:0; padding:0; border-radius:0; display:flex; flex-direction:column;">
    <div class="modal-head" style="flex-shrink:0;">
      <div class="modal-title display" id="previewTitle">Preview</div>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body" id="previewBody" style="flex:1; overflow:auto; padding:0;">
      <div id="previewContent" style="text-align:center; padding:40px;">Loading…</div>
    </div>
  </div>
</div>

<!-- File Menu Modal -->
<div class="overlay" id="fileMenuModal">
  <div class="modal" style="max-width:280px;">
    <button class="btn-ghost" data-action="file-rename" style="width:100%; text-align:left; padding:12px 16px; border:none; cursor:pointer; border-radius:0;">✏️ Rename</button>
    <button class="btn-ghost" data-action="file-move" style="width:100%; text-align:left; padding:12px 16px; border:none; cursor:pointer; border-radius:0;">📁 Move</button>
    <button class="btn-ghost" data-action="file-copy" style="width:100%; text-align:left; padding:12px 16px; border:none; cursor:pointer; border-radius:0;">📋 Copy</button>
    <button class="btn-ghost" data-action="file-download" style="width:100%; text-align:left; padding:12px 16px; border:none; cursor:pointer; border-radius:0;">⬇️ Download</button>
    <hr style="margin:4px 0; border:none; border-top:1px solid var(--hairline);">
    <button class="btn-ghost" data-action="file-delete" style="width:100%; text-align:left; padding:12px 16px; border:none; cursor:pointer; border-radius:0; color:var(--alert);">🗑️ Delete</button>
    <button class="btn-ghost" data-close style="width:100%; text-align:left; padding:12px 16px; border:none; cursor:pointer; border-radius:0;">Cancel</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Scripts -->
<script src="firebase_config.js"></script>
<script src="google_config.js"></script>
<script src="script.js"></script>

</body>
</html>
